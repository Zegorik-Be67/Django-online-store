<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store</title>
</head>
<body>

<a href="{% url 'store:add_product' %}">
    <button>Добавить товар</button>
</a>

<form method="get" action="">
    <input type="search" name="search" value="{{ search }}" placeholder="Найти">
    <button type="submit">Найти</button>
</form>

<form method="get" action="">
    <select name="category" onchange="this.form.submit()">
        <option value="">Все категории</option>
        {% for c in categories %}
            <option value="{{ c.id }}" {% if request.GET.category == c.id|stringformat:"s" %}selected{% endif %}>
                {{ c.name }}
            </option>
        {% endfor %}
    </select>
</form>

{% for s in store %}
<ul>
    <li>
        {% if s.image %}
            <img src="{{ s.image.url }}" alt="{{ s.title }}" width="200">
        {% else %}
            <p>Нет фото</p>
        {% endif %}
        <h3><strong> {{ s.title }} </strong></h3>
        <p><strong>Производитель</strong>: {{ s.whose }} </p>
        <p><strong>Описание</strong>: {{ s.description }} </p>
        <p><strong>Цена</strong>: {{ s.price }} </p>
        <a href="{% url 'store:product_id' id=s.id %}">
            <button>Купить</button>
        </a>
    </li>
</ul>
{% empty %}
        <p>Ничего не найдено</p>
{% endfor %}
</body>
</html>
