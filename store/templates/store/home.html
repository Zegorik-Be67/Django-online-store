<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store</title>
</head>
<body>
<a href="{% url 'store:add_product' %}">
    <button>Добавить товар</button>
</a>

<form method="get" action="">
    <input type="search" name="search" value="{{ search }}" placeholder="Найти">
    <button type="submit">Найти</button>
</form>

<form method="get" action="">
    <select name="category" onchange="this.form.submit()">
        <option value="">Все категории</option>
        {% for c in categories %}
            <option value="{{ c.id }}" {% if request.GET.category == c.id|stringformat:"s" %}selected{% endif %}>
                {{ c.name }}
            </option>
        {% endfor %}
    </select>
</form>

{% for s in store %}
<ul>
    <li>
        {% if s.image %}
            <img src="{{ s.image.url }}" alt="{{ s.title }}" width="200">
        {% else %}
            <p>Нет фото</p>
        {% endif %}
        <strong> {{ s.title }} </strong> : {{ s.whose }}
        {{ s.date_create }}
        {{ s.description }}
        {{ s.price }}
    </li>
</ul>
{% empty %}
        <p>Ничего не найдено</p>
{% endfor %}
</body>
</html>
