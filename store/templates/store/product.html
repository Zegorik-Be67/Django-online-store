<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.title }}</title>
</head>
<body>
{% if specific_product.image %}
    <img src="{{ specific_product.image.url }}" alt="{{ specific_product.title }}" width="200">
{% else %}
    <p>Нет фото</p>
{% endif %}
<h3><strong> {{ specific_product.title }} </strong></h3>
<p><strong>Производитель</strong>: {{ specific_product.whose }} </p>
<p><strong>Описание</strong>: {{ specific_product.description }} </p>
<p><strong>Цена</strong>: {{ specific_product.price }}</p>
<a href="{% url 'store:home' %}">
    <button>Вернуться</button>
</a>
<button>Купить</button>
</body>
</html>
